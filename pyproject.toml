[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wlanpi_webui"
description = "a custom web interface for the WLAN Pi"
readme = {text = "a custom web interface for the WLAN Pi", content-type = "text/markdown"}
requires-python = ">=3.13"
dynamic = ["version"]
authors = [
    {name = "Josh Schmelzle", email = "josh@joshschmelzle.com"},
]
classifiers = [
    "Natural Language :: English",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: System Administrators",
    "Topic :: Utilities",
]
# Loose names, as in wlanpi-core. The pinned versions live in the
# pip-compile locks (requirements.txt from requirements.in, extras.txt from
# extras.in); dh-virtualenv installs requirements.txt before the package, so
# the .deb still ships the locked versions.
dependencies = [
    "flask",
    "gunicorn",
    "psutil",
    "requests",
]

[project.license]
text = "BSD-3-Clause"

[project.optional-dependencies]
testing = [
    "tox",
    "mypy",
    "pytest",
    "pytest-cov",
    "coverage-badge",
    "pytest-mock",
]

[project.urls]
Homepage = "https://github.com/wlan-pi/wlanpi-webui"
Documentation = "https://docs.wlanpi.com"
Source = "https://github.com/wlan-pi/wlanpi-webui"

[tool.setuptools.dynamic]
version = {attr = "wlanpi_webui.__version__.__version__"}

# Flask blueprints are subpackages; templates and static ship via MANIFEST.in.
[tool.setuptools.packages.find]
include = ["wlanpi_webui*"]

# ============================================================================
# PYRIGHT (LSP) CONFIGURATION
# ============================================================================

[tool.pyright]
venvPath = "."
venv = "venv"
pythonVersion = "3.13"
pythonPlatform = "Linux"

# Type checking settings
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = "warning"
reportUnusedVariable = "warning"

# Include/exclude patterns
include = ["wlanpi_webui"]
exclude = [
    "**/__pycache__",
    ".tox",
    "build",
    "dist",
    "venv",
    ".venv"
]

# ============================================================================
# MYPY CONFIGURATION
# ============================================================================

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
# requests/psutil do not ship type information; treat them as untyped.
disable_error_code = ["import-untyped"]

# Exclude directories
exclude = [
    '\.tox',
    'venv',
    'build',
    'dist',
]

# ============================================================================
# COVERAGE CONFIGURATION
# ============================================================================

[tool.coverage.run]
source = ["wlanpi_webui"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.tox/*"
]

[tool.coverage.report]
show_missing = true

# ============================================================================
# RUFF CONFIGURATION
# ============================================================================

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# E/W/F core style + pyflakes, I imports, B/BLE bugbear+blind-except, C4
# comprehensions, UP pyupgrade modernization, RUF ruff-specific. Docstring (D)
# rules are intentionally NOT enabled: core/mcp enforce them because their
# docstrings surface as API/tool descriptions, but WebUI has no such surface,
# so they would only add boilerplate. E501 is owned by `ruff format`: the
# formatter leaves long string lines alone, so linting them is unsatisfiable.
select = ["E", "W", "F", "I", "B", "BLE", "C4", "UP", "RUF"]
# BLE001 was ignored by the previous gate: service boundaries intentionally
# catch Exception and return an error page rather than crashing the request.
ignore = ["E501", "BLE001"]

[tool.ruff.lint.per-file-ignores]
# Blueprint packages import their module after defining `bp` to break import
# cycles; the imported name is the public API surface.
"wlanpi_webui/**/__init__.py" = ["F401", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["wlanpi_webui"]
