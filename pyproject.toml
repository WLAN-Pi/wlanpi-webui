[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

# ============================================================================
# PYRIGHT (LSP) CONFIGURATION
# ============================================================================

[tool.pyright]
venvPath = "."
venv = "venv"
pythonVersion = "3.13"
pythonPlatform = "Linux"

# Type checking settings
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = "warning"
reportUnusedVariable = "warning"

# Include/exclude patterns
include = ["wlanpi_webui"]
exclude = [
    "**/__pycache__",
    ".tox",
    "build",
    "dist",
    "venv",
    ".venv"
]

# ============================================================================
# MYPY CONFIGURATION
# ============================================================================

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
# requests/psutil do not ship type information; treat them as untyped.
disable_error_code = ["import-untyped"]

# Exclude directories
exclude = [
    '\.tox',
    'venv',
    'build',
    'dist',
]

# ============================================================================
# COVERAGE CONFIGURATION
# ============================================================================

[tool.coverage.run]
source = ["wlanpi_webui"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.tox/*"
]

[tool.coverage.report]
show_missing = true

# ============================================================================
# RUFF CONFIGURATION
# ============================================================================

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# E/W/F core style + pyflakes, I imports, B/BLE bugbear+blind-except, C4
# comprehensions, UP pyupgrade modernization, RUF ruff-specific. Docstring (D)
# rules are intentionally NOT enabled: core/mcp enforce them because their
# docstrings surface as API/tool descriptions, but WebUI has no such surface,
# so they would only add boilerplate. E501 is owned by `ruff format`: the
# formatter leaves long string lines alone, so linting them is unsatisfiable.
select = ["E", "W", "F", "I", "B", "BLE", "C4", "UP", "RUF"]
# BLE001 was ignored by the previous gate: service boundaries intentionally
# catch Exception and return an error page rather than crashing the request.
ignore = ["E501", "BLE001"]

[tool.ruff.lint.per-file-ignores]
# Blueprint packages import their module after defining `bp` to break import
# cycles; the imported name is the public API surface.
"wlanpi_webui/**/__init__.py" = ["F401", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["wlanpi_webui"]
