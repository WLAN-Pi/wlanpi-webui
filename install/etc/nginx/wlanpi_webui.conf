map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream librespeed {
    server 127.0.0.1:8081;
    keepalive 32;
}

upstream grafana {
    server 127.0.0.1:3000;
}

upstream webui {
    server unix:/run/wlanpi_webui.sock fail_timeout=5s;
}

server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/ssl/self-signed-wlanpi.cert;
    ssl_certificate_key /etc/nginx/ssl/self-signed-wlanpi.key;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;
    ssl_session_timeout 60m;
    add_header 'Content-Security-Policy' 'upgrade-insecure-requests';
    # No framing by other sites (clickjacking of the login and password forms).
    # Locations with their own add_header (grafana, cockpit) set it themselves.
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/webui_access.log;
    error_log /var/log/webui_error.log;

    error_page 401 = @login_redirect;
    location @login_redirect {
        return 302 /login;
    }

    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }

    # session check used by auth_request subrequests; not reachable from browsers
    location = /auth/check {
        internal;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_pass http://webui;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    keepalive_timeout 5;

    # login / password-change must be reachable without a session
    location = /login {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_pass http://webui;
    }

    location = /change_password {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_pass http://webui;
    }

    location = /logout {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_pass http://webui;
    }

    # static assets are needed to render the login page
    location /static/ {
        try_files $uri @proxy_to_webui;
    }

    location / {
        auth_request /auth/check;
        try_files $uri @proxy_to_webui;
    }

    location @proxy_to_webui {  
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        # we don't want nginx trying to do something clever with
        # redirects, we set the Host: header above already.
        proxy_pass http://webui;
    }

    # Stored speedtest results are a WebUI page, not part of the LibreSpeed app.
    # Prefix match so /app/librespeed/results/<id> also routes to the WebUI.
    location /app/librespeed/results {
        auth_request /auth/check;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_pass http://webui;
    }

    location /app/librespeed/  {
        auth_request /auth/check;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        client_max_body_size 30M;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        send_timeout 1h;
        gzip off;
        proxy_pass http://librespeed/;
    }
    
    location /app/grafana/ {
        auth_request /auth/check;
        proxy_set_header Host $http_host;
        proxy_pass https://grafana;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location /app/grafana/api/live/ {
        auth_request /auth/check;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_pass https://grafana;
    }
    
    location /app/cockpit/ {
        auth_request /auth/check;
        proxy_pass https://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        
        # needed for websocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # change scheme of "Origin" to http
        proxy_set_header Origin https://$host;

        gzip off;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
