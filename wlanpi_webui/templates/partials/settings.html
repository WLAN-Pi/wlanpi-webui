<div class="uk-flex uk-flex-1 uk-flex-column uk-padding">
  <h3 class="uk-h3">Settings</h3>
  <ul class="uk-list">
    <li>Signed in as <strong>{{ current_user }}</strong></li>
  </ul>

  <h4>Interface</h4>
  <p>
    <button class="uk-button uk-button-default" onclick="wlanpiToggleTheme()">Toggle dark mode</button>
  </p>

  <h4>About</h4>
  <p>
    <a hx-get="/about" hx-target="#content" hx-swap="innerHTML" hx-push-url="true" hx-indicator=".progress">About this
      device</a>
  </p>

  <h4>Debug</h4>
  <p>
    <a hx-get="/debug" hx-target="#content" hx-swap="innerHTML" hx-push-url="true" hx-indicator=".progress">Debug
      tools</a>
  </p>

  <h4>Session</h4>
  <form method="post" action="{{ url_for('auth.logout') }}" class="uk-margin-remove">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button class="uk-button uk-button-danger" type="submit">Log out</button>
  </form>
</div>
