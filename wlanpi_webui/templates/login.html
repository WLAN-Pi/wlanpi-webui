<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WLAN Pi: Login</title>
  <meta name="theme-color" content="#fff">
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/uikit.css') }}">
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='js/uikit.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/uikit-icons.min.js') }}"></script>
</head>
<body class="uk-background-muted uk-height-viewport">
  <div class="uk-flex uk-flex-center uk-flex-middle uk-height-viewport">
    <div class="uk-card uk-card-default uk-card-body uk-width-large">
      <div class="uk-text-center uk-margin-bottom">
        <img src="{{ url_for('static', filename='img/wlanpi-sticker.png') }}" alt="WLAN Pi logo" style="width:128px;">
        <h2 class="uk-h3 uk-margin-small-top">WLAN Pi</h2>
      </div>
      {% if error %}
      <div class="uk-alert-danger" uk-alert><p>{{ error }}</p></div>
      {% endif %}
      <form method="post" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="uk-margin">
          <div class="uk-inline uk-width-1-1">
            <span class="uk-form-icon" uk-icon="icon: user"></span>
            <input class="uk-input" type="text" name="username" placeholder="Username" autocomplete="username" required autofocus>
          </div>
        </div>
        <div class="uk-margin">
          <div class="uk-inline uk-width-1-1">
            <span class="uk-form-icon uk-form-icon-flip" uk-icon="icon: lock"></span>
            <input class="uk-input" type="password" name="password" placeholder="Password" autocomplete="current-password" required>
          </div>
        </div>
        <div class="uk-margin">
          <button class="uk-button uk-button-primary uk-width-1-1" type="submit">Log in</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
