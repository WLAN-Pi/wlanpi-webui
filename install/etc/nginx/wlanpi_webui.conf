map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream librespeed {
    server 127.0.0.1:8081;
    keepalive 32;
}

upstream grafana {
    server 127.0.0.1:3000;
}

upstream webui {
    server unix:/run/wlanpi_webui.sock fail_timeout=5s;
}

server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/ssl/self-signed-wlanpi.cert;
    ssl_certificate_key /etc/nginx/ssl/self-signed-wlanpi.key;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;
    ssl_session_timeout 60m;
    add_header 'Content-Security-Policy' 'upgrade-insecure-requests';
    # No framing by other sites (clickjacking of the login and password forms).
    add_header X-Frame-Options "SAMEORIGIN" always;

    # nginx compresses only text/html by default; static CSS/JS is ~1 MB raw,
    # which is slow over Bluetooth PAN.
    gzip_types text/css application/javascript text/javascript image/svg+xml application/wasm;
    gzip_vary on;
    gzip_min_length 1024;

    access_log /var/log/webui_access.log;
    error_log /var/log/webui_error.log;

    error_page 401 = @login_redirect;
    location @login_redirect {
        return 302 /login;
    }

    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }

    # session check used by auth_request subrequests; not reachable from browsers
    location = /auth/check {
        internal;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_pass http://webui;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    keepalive_timeout 5;

    # login / password-change must be reachable without a session
    location = /login {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_pass http://webui;
    }

    location = /change_password {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_pass http://webui;
    }

    location = /logout {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_pass http://webui;
    }

    # static assets are needed to render the login page
    location /static/ {
        try_files $uri @proxy_to_webui;
    }

    location / {
        auth_request /auth/check;
        try_files $uri @proxy_to_webui;
    }

    location @proxy_to_webui {  
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        # we don't want nginx trying to do something clever with
        # redirects, we set the Host: header above already.
        proxy_pass http://webui;
    }

    # The apps moved to their own origins; keep old bookmarks working.
    location = /app/librespeed/librespeed_detailed.html {
        return 302 https://$host:8443$request_uri;
    }

    location = /app/grafana {
        return 302 https://$host:3443/app/grafana/;
    }

    location /app/grafana/ {
        return 302 https://$host:3443$request_uri;
    }

    location = /app/cockpit {
        return 302 https://$host:9090/app/cockpit/;
    }

    location /app/cockpit/ {
        return 302 https://$host:9090$request_uri;
    }
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# LibreSpeed and Grafana each get their own origin (port), so a script
# injection in either can't read WebUI pages or their CSRF tokens. Cockpit
# already has one on :9090. The WebUI session cookie still gates them: browsers
# send cookies to every port on the host.
server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/ssl/self-signed-wlanpi.cert;
    ssl_certificate_key /etc/nginx/ssl/self-signed-wlanpi.key;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;
    ssl_session_timeout 60m;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Server level: the auth_request subrequest checks the upload test's body
    # size against its own location's limit.
    client_max_body_size 30M;

    access_log /var/log/webui_access.log;
    error_log /var/log/webui_error.log;

    error_page 401 = @login_redirect;
    location @login_redirect {
        return 302 https://$host/login;
    }

    location = /auth/check {
        internal;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_pass http://webui;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # The page's back link and logo point at the WebUI.
    location = / {
        return 302 https://$host/;
    }

    location /static/ {
        proxy_set_header Host $http_host;
        proxy_pass http://webui;
    }

    # The page reports each finished test here; the WebUI stores it. Only the
    # POST: the results pages stay on the WebUI origin.
    location = /app/librespeed/results {
        limit_except POST {
            deny all;
        }
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_pass http://webui;
    }

    location /app/librespeed/ {
        auth_request /auth/check;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        send_timeout 1h;
        gzip off;
        proxy_pass http://librespeed/;
    }
}

server {
    listen 3443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/ssl/self-signed-wlanpi.cert;
    ssl_certificate_key /etc/nginx/ssl/self-signed-wlanpi.key;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;
    ssl_session_timeout 60m;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/webui_access.log;
    error_log /var/log/webui_error.log;

    error_page 401 = @login_redirect;
    location @login_redirect {
        return 302 https://$host/login;
    }

    location = /auth/check {
        internal;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_pass http://webui;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location = / {
        return 302 /app/grafana/;
    }

    location /app/grafana/ {
        auth_request /auth/check;
        proxy_set_header Host $http_host;
        proxy_pass https://grafana;
    }

    location /app/grafana/api/live/ {
        auth_request /auth/check;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_pass https://grafana;
    }
}
