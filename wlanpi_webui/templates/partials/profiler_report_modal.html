<div id="profile_{{ stub }}" class="uk-modal uk-modal-container" data-report-modal>
  <div class="uk-modal-dialog uk-modal-body" tabindex="-1" autofocus aria-labelledby="profile_{{ stub }}_title">
    <h2 class="uk-modal-title" id="profile_{{ stub }}_title">{{ title }}</h2>
    <pre>{{ content }}</pre>
    <div class="uk-modal-footer uk-text-right">
      <button class="uk-button uk-button-default uk-modal-close" type="button">Close</button>
      <a class="uk-button uk-button-secondary" href="{{ download_url }}">Save</a>
    </div>
  </div>
</div>
