{% extends "auth/base.html" %}
{% block title %}WLAN Pi: Login{% endblock %}
{% block subtitle %}Sign in to {{ hostname }}{% endblock %}
{% block content %}
{% if expired %}
<div class="uk-alert-warning" uk-alert><p>Your session expired. Please sign in again.</p></div>
{% endif %}
{% if error %}
<div class="uk-alert-danger" uk-alert><p>{{ error }}</p></div>
{% endif %}
<form method="post" action="{{ url_for('auth.login') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="uk-margin">
    <div class="uk-inline uk-width-1-1">
      <span class="uk-form-icon" uk-icon="icon: user"></span>
      <input class="uk-input" type="text" name="username" placeholder="Username" autocomplete="username" required
        autofocus>
    </div>
  </div>
  <div class="uk-margin">
    <div class="uk-inline uk-width-1-1">
      <span class="uk-form-icon uk-form-icon-flip" uk-icon="icon: lock"></span>
      <input class="uk-input" type="password" name="password" placeholder="Password" autocomplete="current-password"
        required>
    </div>
  </div>
  <div class="uk-margin">
    <button class="uk-button uk-button-primary uk-width-1-1" type="submit">Log in</button>
  </div>
</form>
{% endblock %}
