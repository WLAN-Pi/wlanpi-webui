[tox]
skip_missing_interpreters = true
envlist = py313
requires = setuptools >= 65.5.0
           pip >= 22.3
           virtualenv >= 20.16.6

[testenv]
description = run the test driver
deps =
    mock
    pytest
    pytest-mock
    coverage
    coverage-badge
    # coverage-badge (unmaintained) imports pkg_resources, which setuptools no
    # longer ships as of 81; pin it so the badge step runs under Python 3.13.
    setuptools<81
commands =
    coverage run --source wlanpi_webui -m pytest {posargs}
    coverage report --show-missing
    coverage xml
    coverage-badge -f -o coverage.svg

[testenv:lint]
# Installs the package so mypy can resolve the runtime deps it imports
# (flask, requests, psutil); without them every import is import-not-found.
deps =
    ruff
    mypy>=1.14.1
commands =
    ruff check wlanpi_webui tests
    mypy wlanpi_webui

[testenv:formatcheck]
description = run the format check toolchain
basepython = python3
skip_install = true
deps =
    ruff
commands =
    ruff format --check wlanpi_webui tests

[testenv:format]
description = run the format toolchain
basepython = python3
skip_install = true
deps =
    ruff
commands =
    ruff format wlanpi_webui tests
