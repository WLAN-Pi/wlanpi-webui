<div class="packetstorm-stage game-stage" id="packetstorm-stage" data-csrf="{{ csrf_token }}"
  {% if config.GAME_DEBUG or config.DEBUG %}data-debug="1"{% endif %}>
  <canvas id="packetstorm-canvas" tabindex="0" role="img"
    aria-label="Packet Storm: steer the client with arrows or WASD, space fires packets"></canvas>
  <a class="game-exit" href="/" hx-get="/" hx-target="#content" hx-swap="innerHTML"
    hx-push-url="true" hx-indicator=".progress" aria-label="Exit">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 11l9-8 9 8" />
      <path d="M5 10v10h14V10" />
    </svg>
  </a>
  <div class="packetstorm-hud" id="packetstorm-hud" aria-hidden="true"></div>
  <div class="packetstorm-touch" id="packetstorm-touch" hidden>
    <div class="packetstorm-pad">
      <button type="button" data-ps="left" aria-label="Rotate left">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2 5v6h6" />
          <path d="M3.6 15a9 9 0 1 0 2.1-9.4L2 10" />
        </svg>
      </button>
      <button type="button" data-ps="right" aria-label="Rotate right">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M22 5v6h-6" />
          <path d="M20.4 15a9 9 0 1 1-2.1-9.4L22 10" />
        </svg>
      </button>
    </div>
    <div class="packetstorm-pad">
      <button type="button" data-ps="thrust" aria-label="Thrust">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 20V5" />
          <path d="M5 12l7-7 7 7" />
        </svg>
      </button>
      <button type="button" data-ps="fire" aria-label="Fire">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="7" />
          <circle cx="12" cy="12" r="2.4" fill="currentColor" />
        </svg>
      </button>
    </div>
  </div>
  <div class="packetstorm-help" id="packetstorm-help" hidden>
    <div class="packetstorm-help-box">
      <h2 class="packetstorm-help-title">Packet Storm</h2>
      <ul class="packetstorm-help-keys">
        <li><span>Rotate</span><span><kbd>&larr;</kbd> <kbd>&rarr;</kbd> / <kbd>A</kbd> <kbd>D</kbd></span></li>
        <li><span>Thrust</span><span><kbd>&uarr;</kbd> / <kbd>W</kbd></span></li>
        <li><span>Fire</span><kbd>Space</kbd></li>
        <li><span>Channel hop</span><kbd>Shift</kbd></li>
        <li><span>Pause</span><kbd>P</kbd></li>
        <li><span>Mute</span><kbd>M</kbd></li>
        <li><span>Leave</span><kbd>Esc</kbd></li>
      </ul>
      <div class="packetstorm-difficulty" role="group" aria-label="Difficulty">
        <button type="button" data-diff="normal">Normal</button>
        <button type="button" data-diff="easy">Easy</button>
      </div>
      <p class="packetstorm-help-hint">Press any key or tap to start</p>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/packetstorm.js') }}" defer></script>
</div>
