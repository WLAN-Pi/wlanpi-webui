<div class="page uk-flex uk-flex-1 uk-flex-column">
  <div class="page-head-row">
    <div class="page-head">
      <p class="page-eyebrow">Connectivity</p>
      <h2 class="page-title">Network</h2>
      <p class="page-lede">Uplink, reachability, and neighbour data.</p>
    </div>
    <div class="page-head-controls">
      <label class="visually-hidden" for="net-interval">Refresh interval</label>
      <select id="net-interval" class="uk-select" data-poll-select="network-cards"
        onchange="wlanpiStartPoll('network-cards', 'refresh-network', parseInt(this.value, 10))">
        <option value="5">5s</option>
        <option value="15" selected>15s</option>
        <option value="30">30s</option>
        <option value="60">60s</option>
      </select>
      <button class="uk-button uk-button-default" type="button" data-poll-toggle="network-cards"
        onclick="wlanpiTogglePoll('network-cards', 'refresh-network', this)" aria-pressed="false">Pause refresh</button>
      <button class="uk-button uk-button-default" type="button"
        onclick="wlanpiFirePoll('network-cards', 'refresh-network')">Refresh now</button>
    </div>
  </div>
  <script>wlanpiInitPoll('network-cards', 'refresh-network', 15)</script>
  <div class="uk-card uk-card-default uk-card-body uk-margin-bottom">
    <h3 class="uk-card-title">Latency</h3>
    <div class="latency-wrap">
      <canvas id="latency-chart" aria-label="Latency over the last five minutes"></canvas>
      <div class="latency-empty" id="latency-empty" hidden>Collecting latency samples...</div>
    </div>
  </div>
  <script>
  // Latency history: samples the Reachability card after every cards refresh
  // and draws ping google / ping gateway / arping on one graph. Chart.js is
  // lazy-loaded so the 200 KB bundle never blocks the page, and the colours
  // come from the theme tokens.
  (function () {
    if (window.wlanpiLatencyInit) return;
    window.wlanpiLatencyInit = true;

    var KEY = "wlanpi-latency";
    var MAX = 120;
    var chartUrl = "{{ url_for('static', filename='js/Chart.bundle.min.js') }}";

    function loadChart(cb) {
      if (window.Chart) { cb(); return; }
      var s = document.getElementById("chartjs-loader");
      if (s) { s.addEventListener("load", cb, { once: true }); return; }
      s = document.createElement("script");
      s.id = "chartjs-loader";
      s.src = chartUrl;
      s.onload = cb;
      document.head.appendChild(s);
    }

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
    }

    function save(hist) {
      try { localStorage.setItem(KEY, JSON.stringify(hist.slice(-MAX))); } catch (e) { /* ignore */ }
    }

    function parseVal(text, label) {
      var m = text.match(new RegExp(label + ":\\s*([0-9.]+)\\s*ms"));
      return m ? parseFloat(m[1]) : null;
    }

    function cssVar(name, fallback) {
      try {
        var v = getComputedStyle(document.documentElement).getPropertyValue(name);
        return (v && v.trim()) || fallback;
      } catch (e) { return fallback; }
    }

    function colors() {
      return {
        text: cssVar("--text-muted", "#888"),
        grid: cssVar("--border", "rgba(128,128,128,0.25)"),
        brand: cssVar("--brand", "#f45625"),
        info: cssVar("--info", "#0277bd"),
        success: cssVar("--success", "#2e7d32")
      };
    }

    function dataset(hist, key, label, color, pointRadius) {
      return {
        label: label,
        data: hist.map(function (p) { return p[key]; }),
        fill: false,
        lineTension: 0.1,
        borderColor: color,
        backgroundColor: color,
        pointRadius: pointRadius,
        spanGaps: false
      };
    }

    function history() {
      var cutoff = Date.now() - 5 * 60 * 1000;
      return load().filter(function (p) { return p.t >= cutoff; });
    }

    function dataFor(hist, c) {
      // Dots while the window is sparse, so the first sample is visible.
      var pr = hist.length <= 8 ? 2 : 0;
      return {
        labels: hist.map(function (p) { return new Date(p.t).toLocaleTimeString(); }),
        datasets: [
          dataset(hist, "g", "Ping Google", c.brand, pr),
          dataset(hist, "gw", "Ping Gateway", c.info, pr),
          dataset(hist, "arp", "Arping Gateway", c.success, pr)
        ]
      };
    }

    function options(c) {
      var narrow = window.innerWidth < 640;
      return {
        type: "line",
        data: { labels: [], datasets: [] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          legend: {
            position: narrow ? "bottom" : "top",
            labels: { fontColor: c.text, fontSize: narrow ? 10 : 12, boxWidth: narrow ? 10 : 12 }
          },
          scales: {
            xAxes: [{
              gridLines: { color: c.grid },
              ticks: { fontColor: c.text, maxTicksLimit: narrow ? 4 : 8, fontSize: narrow ? 9 : 11 }
            }],
            yAxes: [{
              gridLines: { color: c.grid },
              ticks: { fontColor: c.text, beginAtZero: true, fontSize: narrow ? 9 : 11 },
              scaleLabel: { display: !narrow, labelString: "ms", fontColor: c.text }
            }]
          }
        }
      };
    }

    function render() {
      var canvas = document.getElementById("latency-chart");
      if (!canvas) return;
      var empty = document.getElementById("latency-empty");
      var hist = history();
      var points = hist.filter(function (p) {
        return p.g != null || p.gw != null || p.arp != null;
      }).length;
      if (empty) empty.hidden = points >= 1;
      if (points < 1) {
        canvas.style.visibility = "hidden";
        return;
      }
      canvas.style.visibility = "visible";
      if (!window.Chart) return;
      var c = colors();
      if (!window.wlanpiLatencyChart || !canvas.dataset.live) {
        if (window.wlanpiLatencyChart) window.wlanpiLatencyChart.destroy();
        var opts = options(c);
        opts.data = dataFor(hist, c);
        window.wlanpiLatencyChart = new Chart(canvas.getContext("2d"), opts);
        canvas.dataset.live = "1";
      } else {
        var ch = window.wlanpiLatencyChart;
        var data = dataFor(hist, c);
        ch.data.labels = data.labels;
        ch.data.datasets = data.datasets;
        ch.options.legend.labels.fontColor = c.text;
        ch.options.scales.xAxes[0].ticks.fontColor = c.text;
        ch.options.scales.xAxes[0].gridLines.color = c.grid;
        ch.options.scales.yAxes[0].ticks.fontColor = c.text;
        ch.options.scales.yAxes[0].gridLines.color = c.grid;
        ch.update();
      }
    }

    function sample() {
      var card = document.getElementById("reachability");
      if (!card) return;
      var text = card.innerText;
      var hist = load();
      hist.push({
        t: Date.now(),
        g: parseVal(text, "Ping Google"),
        gw: parseVal(text, "Ping Gateway"),
        arp: parseVal(text, "Arping Gateway")
      });
      save(hist);
      render();
    }

    document.body.addEventListener("htmx:afterSwap", function (evt) {
      if (evt.detail && evt.detail.target && evt.detail.target.id === "network-cards") {
        sample();
      }
    });

    // Follow the theme: re-read the tokens when it flips.
    try {
      new MutationObserver(render).observe(document.documentElement, {
        attributes: true, attributeFilter: ["data-theme"]
      });
    } catch (e) { /* ignore */ }

    loadChart(render);
    render();
  })();
  </script>
  <div id="network-cards" hx-get="/network/cards" hx-trigger="load, refresh-network" hx-swap="innerHTML">
    <div class="uk-grid-small uk-child-width-1-2@s uk-child-width-1-3@m" uk-grid>
      {% for _ in range(6) %}
      <div>
        <div class="uk-card uk-card-default uk-card-body" aria-busy="true" aria-label="Loading">
          <p class="skel" style="height: 1.1em; width: 55%;"></p>
          <p class="skel" style="height: 0.85em;"></p>
          <p class="skel" style="height: 0.85em; width: 75%;"></p>
          <p class="skel" style="height: 0.85em; width: 60%;"></p>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
