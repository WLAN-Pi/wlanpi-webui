<div id="profile_{{ stub }}" class="uk-modal uk-modal-container" style="display:block;">
  <div class="uk-modal-dialog uk-modal-body">
    <h2 class="uk-modal-title">{{ title }}</h2>
    <pre>{{ content }}</pre>
    <div class='uk-modal-footer uk-text-right'>
      <form _="on submit take .uk-open from #profile_{{ stub }}">
        <button id="cancelButton" type="button" class="uk-button uk-button-default"
          _="on click take .uk-open from #profile_{{ stub }} wait 200ms then remove #profile_{{ stub }}">Close</button>
        <a href="{{ download_url }}"><button class="uk-button uk-button-secondary" type="button">Save</button></a>
      </form>
    </div>
  </div>
</div>
