{% extends "auth/base.html" %}
{% block title %}WLAN Pi: Change Password{% endblock %}
{% block heading %}Change password{% endblock %}
{% block subtitle %}Your password has expired. Set a new one to continue.{% endblock %}
{% block content %}
{% if error %}
<div class="uk-alert-danger" uk-alert><p>{{ error }}</p></div>
{% endif %}
<form method="post" action="{{ url_for('auth.change_password') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="uk-margin">
    <label class="uk-form-label" for="cp-username">Username</label>
    <div class="uk-inline uk-width-1-1">
      <span class="uk-form-icon" uk-icon="icon: user"></span>
      <input id="cp-username" class="uk-input" type="text" name="username" autocomplete="username" required
        autofocus{% if username %} value="{{ username }}"{% endif %}>
    </div>
  </div>
  <div class="uk-margin">
    <label class="uk-form-label" for="cp-current-password">Current password</label>
    <div class="uk-inline uk-width-1-1">
      <span class="uk-form-icon uk-form-icon-flip" uk-icon="icon: lock"></span>
      <input id="cp-current-password" class="uk-input" type="password" name="current_password"
        autocomplete="current-password" required>
    </div>
  </div>
  <div class="uk-margin">
    <label class="uk-form-label" for="cp-new-password">New password</label>
    <div class="uk-inline uk-width-1-1">
      <span class="uk-form-icon uk-form-icon-flip" uk-icon="icon: lock"></span>
      <input id="cp-new-password" class="uk-input" type="password" name="new_password"
        autocomplete="new-password" required>
    </div>
  </div>
  <div class="uk-margin">
    <label class="uk-form-label" for="cp-new-password-confirm">Confirm new password</label>
    <div class="uk-inline uk-width-1-1">
      <span class="uk-form-icon uk-form-icon-flip" uk-icon="icon: lock"></span>
      <input id="cp-new-password-confirm" class="uk-input" type="password" name="new_password_confirm"
        autocomplete="new-password" required>
    </div>
  </div>
  <div class="uk-margin">
    <button class="uk-button uk-button-primary uk-width-1-1" type="submit">Change password</button>
  </div>
</form>
{% endblock %}
